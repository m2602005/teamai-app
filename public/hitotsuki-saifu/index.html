<!doctype html>
<html lang="ja">
<head>
<title>ひと月さいふ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a wallet — 残り (summary) → カレンダー (detail) → グラフ (comparison). */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --line:#dfe6e2; --fg:#17231e; --muted:#62716a;
  --accent:#16795d; --accent-soft:#dcefe7; --last:#a7b1ac;
  --warn:#b86e00; --warn-soft:#fbefd9; --bad:#c23b32; --bad-soft:#fbe3e0;
  --sun:#c23b32; --sat:#2d63b5;
  --font-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18211e; --line:#2a3632; --fg:#e8efeb; --muted:#93a39b;
  --accent:#4cc39c; --accent-soft:#1d3b31; --last:#5f6d67;
  --warn:#f0a940; --warn-soft:#3b2e17; --bad:#ff7b70; --bad-soft:#40211f;
  --sun:#ff8a80; --sat:#7fa8ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18211e; --line:#2a3632; --fg:#e8efeb; --muted:#93a39b;
  --accent:#4cc39c; --accent-soft:#1d3b31; --last:#5f6d67;
  --warn:#f0a940; --warn-soft:#3b2e17; --bad:#ff7b70; --bad-soft:#40211f;
  --sun:#ff8a80; --sat:#7fa8ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{font-family:var(--font-display);font-weight:800;font-size:1.35rem;letter-spacing:.02em}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem}
.nav button:disabled{opacity:.35;cursor:default}

.banner{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.85rem}
.banner[data-kind="note"]{background:transparent;padding:0 2px;color:var(--muted);font-size:.78rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.left-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.pill{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill[data-s="good"]{background:var(--accent-soft);color:var(--accent)}
.pill[data-s="warn"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-s="bad"]{background:var(--bad-soft);color:var(--bad)}
.big{font-size:2.6rem;font-weight:800;line-height:1.15;margin-top:2px}
.big[data-s="bad"]{color:var(--bad)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.bar i[data-s="warn"]{background:var(--warn)}
.bar i[data-s="bad"]{background:var(--bad)}
.sub{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.sub b{color:var(--fg);font-weight:700}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.limitpanel{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.yen-in{flex:1;min-width:0;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
.yen-in span{color:var(--muted)}
.yen-in input{flex:1;min-width:0;border:none;background:transparent;color:var(--fg);font:700 1.2rem var(--font-display);padding:10px 6px;outline:none}
.primary{border:none;border-radius:10px;background:var(--accent);color:var(--surface);font-weight:700;padding:11px 18px}

/* calendar */
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{font-size:.72rem;color:var(--muted);text-align:center;margin:4px 0 6px}
.cal-head .su{color:var(--sun)} .cal-head .sa{color:var(--sat)}
.day{aspect-ratio:1/1.05;max-width:100%;border:none;border-radius:10px;background:var(--bg);padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.day .d{font-size:.78rem;color:var(--muted);line-height:1}
.day .a{font-family:var(--font-display);font-variant-numeric:tabular-nums;font-size:.72rem;font-weight:700;line-height:1.1;white-space:nowrap}
.day.su .d{color:var(--sun)} .day.sa .d{color:var(--sat)}
.day.spent{background:var(--accent-soft)}
.day.over{background:var(--warn-soft)} .day.over .a{color:var(--warn)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.future{opacity:.4;cursor:default}
.day.blank{visibility:hidden}
.legend-cal{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend-cal span{display:inline-flex;align-items:center;gap:5px}
.legend-cal i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* chart */
.chart-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.h2{font-family:var(--font-display);font-weight:700;font-size:1rem;margin:0}
.keys{display:flex;gap:12px;font-size:.78rem;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px}
.keys i{width:14px;height:3px;border-radius:2px;display:inline-block}
.keys[data-mode="bar"] i{width:10px;height:10px;border-radius:3px}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px;margin-top:10px}
.seg button{border:none;background:transparent;border-radius:999px;padding:5px 14px;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.compare{font-size:.88rem;margin:6px 0 4px}
.chartwrap{position:relative;margin-top:4px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:.78rem;line-height:1.5;white-space:nowrap;transform:translateX(-50%)}

/* FAB + sheet */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
  border:none;border-radius:999px;background:var(--accent);color:var(--surface);font-weight:700;padding:14px 22px;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:85vh;overflow:auto}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.x{border:none;background:var(--bg);border-radius:50%;width:36px;height:36px;font-size:1.1rem}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.items .c{font-size:.75rem;background:var(--bg);border-radius:6px;padding:2px 8px;color:var(--muted)}
.items .v{margin-left:auto;font-weight:700}
.items .del{border:none;background:none;color:var(--muted);font-size:.8rem;padding:4px}
.empty{color:var(--muted);font-size:.85rem}
.err{color:var(--bad);font-size:.82rem;min-height:1em}
.wrap.locked > :not(header):not(#authCard):not(#saveNote){display:none}
.auth{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="month" id="monthTitle">—</div>
    <div class="nav">
      <button id="prevBtn" aria-label="前の月">‹</button>
      <button id="nextBtn" aria-label="次の月">›</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="banner" id="notice" hidden></div>

  <section class="card auth" id="authCard" hidden aria-labelledby="authTitle">
    <h2 class="h2" id="authTitle">ログイン</h2>
    <p class="label">記録はSupabaseに保存され、自分だけが見られます。</p>
    <label class="field"><span class="label">メールアドレス</span><input id="authEmail" type="email" autocomplete="email"></label>
    <label class="field"><span class="label">パスワード（6文字以上）</span><input id="authPw" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="primary" id="signInBtn">ログイン</button><button class="chip" id="signUpBtn">はじめて使う（登録）</button></div>
    <div class="err" id="authMsg" role="status"></div>
  </section>

  <section class="card" aria-labelledby="leftLabel">
    <div class="left-top">
      <span class="label" id="leftLabel">今月あと使えるお金</span>
      <span class="pill" id="pill"></span>
    </div>
    <div class="big num" id="leftAmount">—</div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="sub">
      <span id="perDay"></span>
      <span>限度額 <b class="num" id="limitAmt">—</b> <button class="linkbtn" id="limitToggle" aria-expanded="false">変える</button></span>
    </div>
    <div class="limitpanel" id="limitPanel" hidden>
      <div class="label" id="limitHint">先月の出費から決めます</div>
      <div class="chips" id="modeChips"></div>
      <div class="row" id="customRow" hidden>
        <label class="yen-in"><span>¥</span><input id="customIn" inputmode="numeric" autocomplete="off" aria-label="限度額"></label>
        <button class="primary" id="customSave">決める</button>
      </div>
    </div>
  </section>

  <section class="card" aria-label="カレンダー">
    <div class="cal-head" aria-hidden="true"><span class="su">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sa">土</span></div>
    <div class="cal" id="cal"></div>
    <div class="legend-cal">
      <span><i style="background:var(--accent-soft)"></i>1日の目安内</span>
      <span><i style="background:var(--warn-soft)"></i>目安オーバー</span>
    </div>
  </section>

  <section class="card" aria-labelledby="chartTitle">
    <div class="chart-top">
      <h2 class="h2" id="chartTitle">先月とくらべる</h2>
      <div class="keys" id="keys"><span><i style="background:var(--accent)"></i>今月</span><span><i style="background:var(--last)"></i>先月</span></div>
    </div>
    <div class="seg" role="group" aria-label="グラフの種類">
      <button id="segLine" aria-pressed="true">折れ線（累計）</button>
      <button id="segBar" aria-pressed="false">棒（週ごと）</button>
    </div>
    <div class="compare" id="compare"></div>
    <div class="chartwrap" id="chartwrap">
      <svg id="chart" role="img"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>
  <div class="banner" data-kind="note" id="saveNote"><span id="noteText"></span> <button class="linkbtn" id="logoutBtn" hidden>ログアウト</button></div>
</div>

<button class="fab" id="fab">＋ 今日の出費</button>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-in">
    <div class="sheet-top">
      <div><div class="h2" id="sheetTitle">—</div><div class="label num" id="sheetTotal"></div></div>
      <button class="x" id="sheetClose" aria-label="閉じる">×</button>
    </div>
    <ul class="items" id="items"></ul>
    <div class="chips" id="catChips" role="group" aria-label="分類"></div>
    <div class="row">
      <label class="yen-in"><span>¥</span><input id="amountIn" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="金額"></label>
      <button class="primary" id="addBtn">追加</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
const CATS=[["food","食費"],["move","交通"],["fun","遊び"],["daily","日用品"],["other","その他"]];
const CAT=Object.fromEntries(CATS);
const MODES=[["same","先月と同じ",1],["m10","先月の90%",.9],["m20","先月の80%",.8],["custom","自分で決める",null]];
const LS="hitotsuki-saifu-v1";
const now=new Date(); const TODAY={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
const S={months:{},settings:{mode:"m10",custom:0},view:{y:TODAY.y,m:TODAY.m},store:"local",sel:null,cat:"food",panel:false};

const $=id=>document.getElementById(id);
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const key=(y,m)=>{const d=new Date(y,m,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const shift=(v,k)=>{const d=new Date(v.y,v.m+k,1);return{y:d.getFullYear(),m:d.getMonth()}};
const isCur=v=>v.y===TODAY.y&&v.m===TODAY.m;

/* ---------- example data (shown only until the first real entry) ---------- */
function rng(seed){return()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648}}
function makeSample(){
  const out={};
  [shift(TODAY,-1),TODAY].forEach((v,i)=>{
    const r=rng(42+i*7), last=i===1?TODAY.d:dim(v.y,v.m), items=[];
    for(let d=1;d<=last;d++){
      if(r()<.8)items.push({id:"s"+d+"a",day:d,amount:Math.round((350+r()*800)/10)*10,cat:"food"});
      if(r()<.25)items.push({id:"s"+d+"b",day:d,amount:Math.round((200+r()*500)/10)*10,cat:"move"});
      if(r()<.13)items.push({id:"s"+d+"c",day:d,amount:Math.round((1500+r()*3000)/100)*100,cat:"fun"});
      if(r()<.1)items.push({id:"s"+d+"d",day:d,amount:Math.round((300+r()*900)/10)*10,cat:"daily"});
    }
    out[key(v.y,v.m)]=items;
  });
  return out;
}
const SAMPLE=makeSample();
const hasReal=()=>Object.values(S.months).some(a=>a&&a.length);
const items=v=>(hasReal()?S.months[key(v.y,v.m)]:SAMPLE[key(v.y,v.m)])||[];
const total=v=>items(v).reduce((s,i)=>s+i.amount,0);
function daily(v){const a=new Array(dim(v.y,v.m)+1).fill(0);items(v).forEach(i=>{if(i.day<a.length)a[i.day]+=i.amount});return a}

function limitFor(v){
  const prev=total(shift(v,-1)); const mode=MODES.find(x=>x[0]===S.settings.mode)||MODES[1];
  if(mode[0]==="custom")return{limit:S.settings.custom||0,prev};
  return{limit:Math.floor(prev*mode[2]/100)*100,prev};
}

/* ---------- storage: Supabase (falls back to this browser when not configured) ---------- */
const CFG=window.SAIFU_CONFIG||{};
const sb=(window.supabase&&CFG.url&&CFG.anonKey&&!/YOUR-/.test(CFG.url+CFG.anonKey))?window.supabase.createClient(CFG.url,CFG.anonKey):null;
let session=null;
S.store=sb?"supabase":"local";

function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.months=j.months||{};S.settings=Object.assign(S.settings,j.settings||{})}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({months:S.months,settings:S.settings}))}catch(e){}}
const pad2=n=>String(n).padStart(2,"0");

function toMonths(rows){const out={};rows.forEach(r=>{const [y,m,d]=r.spent_on.split("-");(out[y+"-"+m]=out[y+"-"+m]||[]).push({id:r.id,day:+d,amount:r.amount,cat:r.category})});return out}
async function loadRemote(){
  S.loading=true;render();
  const [e,s]=await Promise.all([
    sb.from("expenses").select("id,spent_on,amount,category").order("spent_on"),
    sb.from("settings").select("mode,custom").maybeSingle()]);
  S.loading=false;
  if(e.error){S.notice="記録を読み込めませんでした（"+e.error.message+"）。通信を確認して、ページを開き直してください。";render();return}
  S.notice="";S.months=toMonths(e.data||[]);
  S.settings=s.data?{mode:s.data.mode,custom:s.data.custom||0}:{mode:"m10",custom:0};
  render();
}

async function addExpense(k,day,amount,cat){
  const tmp={id:"tmp-"+Date.now().toString(36),day,amount,cat};
  (S.months[k]=S.months[k]||[]).push(tmp);render();
  if(!sb){saveLocal();return}
  const {data,error}=await sb.from("expenses").insert({spent_on:k+"-"+pad2(day),amount,category:cat}).select("id").single();
  if(error){S.months[k]=S.months[k].filter(x=>x!==tmp);$("err").textContent="保存できませんでした（"+error.message+"）。もう一度入れてください。";render();return}
  tmp.id=data.id;
}
async function removeItem(k,id){
  const before=S.months[k]||[];S.months[k]=before.filter(x=>x.id!==id);render();
  if(!sb){saveLocal();return}
  if(String(id).startsWith("tmp-"))return;
  const {error}=await sb.from("expenses").delete().eq("id",id);
  if(error){S.months[k]=before;$("err").textContent="削除できませんでした（"+error.message+"）";render()}
}
async function saveSettings(){
  if(!sb){saveLocal();return}
  const {error}=await sb.from("settings").upsert({user_id:session.user.id,mode:S.settings.mode,custom:S.settings.custom||0,updated_at:new Date().toISOString()});
  if(error){S.notice="限度額を保存できませんでした（"+error.message+"）";render()}
}

/* ---------- login ---------- */
async function auth(kind){
  const email=$("authEmail").value.trim(), pw=$("authPw").value, msg=$("authMsg");
  if(!email||pw.length<6){msg.textContent="メールアドレスと6文字以上のパスワードを入れてください";return}
  msg.textContent=kind==="in"?"ログインしています…":"登録しています…";
  const r=kind==="in"?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw});
  if(r.error){msg.textContent=(kind==="in"?"ログインできませんでした：":"登録できませんでした：")+r.error.message;return}
  if(kind==="up"&&!r.data.session){msg.textContent="確認メールを送りました。メールのリンクを開いてから、ログインしてください。";return}
  msg.textContent="";$("authPw").value="";
}
async function start(){
  if(!sb){loadLocal();render();return}
  sb.auth.onAuthStateChange((_ev,s)=>{
    const was=session&&session.user.id;session=s;
    if(!s){S.months={};S.settings={mode:"m10",custom:0};render()}
    else if(was!==s.user.id)setTimeout(loadRemote,0); // not inside the auth callback
    else render();
  });
}

/* ---------- render ---------- */
function render(){
  const v=S.view, cur=isCur(v), n=dim(v.y,v.m);
  $("monthTitle").textContent=v.y+"年"+(v.m+1)+"月";
  $("nextBtn").disabled=cur;
  $("fab").hidden=!cur;
  const b=$("banner");
  if(!hasReal()){b.hidden=false;b.textContent="いまは例のデータです。出費を1件入れると、あなたの記録に切り替わります。"}else b.hidden=true;
  const locked=!!sb&&!session; document.querySelector(".wrap").classList.toggle("locked",locked); $("authCard").hidden=!locked;
  if(locked)$("fab").hidden=true;
  $("noteText").textContent=sb?(session?session.user.email+" でログイン中・Supabaseに保存":""):"Supabaseが未設定のため、この端末のブラウザに保存しています（config.js を設定してください）";
  $("logoutBtn").hidden=!(sb&&session);
  const nb=$("notice"); nb.hidden=!S.notice&&!S.loading; nb.textContent=S.loading?"読み込み中…":S.notice||"";

  // summary
  const {limit,prev}=limitFor(v), spent=total(v), left=limit-spent;
  const elapsed=cur?TODAY.d:n;
  let st="good",pill="順調";
  if(!limit){st="warn";pill="限度額を決めよう"}
  else if(spent>limit){st="bad";pill="オーバー"}
  else if(cur&&spent/limit>elapsed/n+.1){st="warn";pill="ペース速め"}
  else if(!cur){pill="達成"}
  $("leftLabel").textContent=cur?"今月あと使えるお金":(v.m+1)+"月の残り";
  $("pill").dataset.s=st;$("pill").textContent=pill;
  const big=$("leftAmount");big.dataset.s=left<0?"bad":"";
  big.textContent=limit?(left<0?"−"+yen(-left).slice(1)+"円 超え":yen(left)):"—";
  const pct=limit?Math.min(100,spent/limit*100):0;
  $("barFill").style.width=pct+"%";$("barFill").dataset.s=st;
  const rest=n-TODAY.d+1;
  $("perDay").innerHTML="";
  const pd=document.createElement("span");
  if(cur&&limit&&left>0){pd.append("1日 ");const bb=document.createElement("b");bb.className="num";bb.textContent=yen(left/rest);pd.append(bb," まで（あと"+rest+"日）")}
  else{pd.append("使った ");const bb=document.createElement("b");bb.className="num";bb.textContent=yen(spent);pd.append(bb)}
  $("perDay").append(pd);
  $("limitAmt").textContent=limit?yen(limit):"未設定";

  // limit panel
  $("limitPanel").hidden=!S.panel;$("limitToggle").setAttribute("aria-expanded",S.panel);
  $("limitHint").textContent=prev?"先月の出費は "+yen(prev)+"。ここから限度額を決めます":"先月の記録がありません。金額を入れて決めてください";
  const mc=$("modeChips");mc.innerHTML="";
  MODES.forEach(([k,l,r])=>{const c=document.createElement("button");c.className="chip";c.textContent=r&&prev?l+"（"+yen(Math.floor(prev*r/100)*100)+"）":l;
    c.setAttribute("aria-pressed",S.settings.mode===k);c.disabled=!!r&&!prev;if(c.disabled)c.style.opacity=.4;
    c.onclick=()=>{S.settings.mode=k;if(k!=="custom")saveSettings();render();if(k==="custom")$("customIn").focus()};mc.append(c)});
  $("customRow").hidden=S.settings.mode!=="custom";
  if(document.activeElement!==$("customIn"))$("customIn").value=S.settings.custom?S.settings.custom.toLocaleString("ja-JP"):"";

  // calendar
  const dd=daily(v), pace=limit?limit/n:Infinity, cal=$("cal");cal.innerHTML="";
  const start=new Date(v.y,v.m,1).getDay();
  for(let i=0;i<start;i++){const e=document.createElement("div");e.className="day blank";cal.append(e)}
  for(let d=1;d<=n;d++){
    const wd=(start+d-1)%7, btn=document.createElement("button"), fut=cur&&d>TODAY.d;
    btn.className="day"+(wd===0?" su":wd===6?" sa":"")+(fut?" future":"")+(cur&&d===TODAY.d?" today":"")+(dd[d]?(dd[d]>pace?" over":" spent"):"");
    const a=document.createElement("span");a.className="d";a.textContent=d;
    const b2=document.createElement("span");b2.className="a";b2.textContent=dd[d]?(dd[d]>=10000?(dd[d]/10000).toFixed(1)+"万":dd[d].toLocaleString("ja-JP")):"";
    btn.append(a,b2);
    btn.setAttribute("aria-label",(v.m+1)+"月"+d+"日 "+(dd[d]?yen(dd[d]):"出費なし"));
    if(fut)btn.disabled=true;else btn.onclick=()=>openSheet(d);
    cal.append(btn);
  }

  // compare line
  const pv=shift(v,-1), pdaily=daily(pv);
  const upto=Math.min(elapsed,pdaily.length-1);
  const pSame=pdaily.slice(1,upto+1).reduce((s,x)=>s+x,0), diff=spent-pSame;
  const cmp=$("compare");cmp.innerHTML="";
  if(pSame||spent){cmp.append("先月の"+upto+"日までより ");const s=document.createElement("b");s.className="num";
    s.style.color=diff>0?"var(--warn)":"var(--accent)";s.textContent=(diff>0?"+":"−")+yen(Math.abs(diff)).slice(1)+"円";cmp.append(s,diff>0?" 多い":" 少ない")}
  const isBar=S.chart==="bar";
  $("segLine").setAttribute("aria-pressed",!isBar);$("segBar").setAttribute("aria-pressed",isBar);
  $("keys").dataset.mode=isBar?"bar":"line";
  $("tip").hidden=true;
  if(isBar)drawBars(v,dd,pdaily,cur?TODAY.d:n);else drawChart(v,dd,pdaily,limit,cur?TODAY.d:n);

  if(S.sel)fillSheet();
}

/* ---------- chart: cumulative spend, this month vs last ---------- */
function cum(a,upto){const out=[];let s=0;for(let d=1;d<=upto;d++){s+=a[d]||0;out.push([d,s])}return out}
function drawChart(v,dd,pd,limit,upto){
  const svg=$("chart"), W=Math.max(280,$("chartwrap").clientWidth||520), H=210, m={l:46,r:38,t:14,b:24};
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const N=Math.max(dd.length,pd.length)-1;
  const A=cum(dd,upto), B=cum(pd,pd.length-1);
  const maxV=Math.max(limit||0,A.length?A[A.length-1][1]:0,B.length?B[B.length-1][1]:0,1000)*1.08;
  const steps=[1000,2000,5000,10000,20000,25000,50000,100000];const step=steps.find(s=>maxV/s<=4)||200000;
  const top=Math.ceil(maxV/step)*step;
  const x=d=>m.l+(d-1)/(N-1)*(W-m.l-m.r), y=val=>m.t+(1-val/top)*(H-m.t-m.b);
  const NS="http://www.w3.org/2000/svg";svg.innerHTML="";
  const el=(t,at,txt)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e};
  for(let t=0;t<=top;t+=step){el("line",{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:"var(--line)","stroke-width":1});
    el("text",{x:m.l-6,y:y(t)+4,"text-anchor":"end","font-size":10.5,fill:"var(--muted)"},t?(t/10000>=1?(t/10000)+"万":(t/1000)+"千"):"0")}
  [1,10,20,N].forEach(d=>el("text",{x:x(d),y:H-6,"text-anchor":"middle","font-size":10.5,fill:"var(--muted)"},d+"日"));
  if(limit){el("line",{x1:m.l,x2:W-m.r,y1:y(limit),y2:y(limit),stroke:"var(--fg)","stroke-width":1.5,"stroke-dasharray":"5 4",opacity:.55});
    el("text",{x:m.l+6,y:y(limit)-6,"text-anchor":"start","font-size":11,"font-weight":700,fill:"var(--fg)"},"限度額 "+yen(limit))}
  const path=pts=>pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join("");
  if(B.length)el("path",{d:path(B),fill:"none",stroke:"var(--last)","stroke-width":2,"stroke-linejoin":"round"});
  if(A.length){
    el("path",{d:path(A)+"L"+x(A[A.length-1][0])+" "+y(0)+"L"+x(1)+" "+y(0)+"Z",fill:"var(--accent)",opacity:.1});
    el("path",{d:path(A),fill:"none",stroke:"var(--accent)","stroke-width":2.5,"stroke-linejoin":"round"});
  }
  // direct labels
  let la=A.length?y(A[A.length-1][1]):null, lb=B.length?y(B[B.length-1][1]):null;
  if(B.length){el("text",{x:x(B[B.length-1][0])+6,y:lb+4,"font-size":11,fill:"var(--muted)"},"先月")}
  if(A.length){const ex=x(A[A.length-1][0]);el("circle",{cx:ex,cy:la,r:4.5,fill:"var(--accent)",stroke:"var(--surface)","stroke-width":2});
    if(lb==null||Math.abs(la-lb)>14||ex<W-m.r-30)el("text",{x:ex+(ex>W-m.r-30?6:8),y:la+4,"font-size":11,"font-weight":700,fill:"var(--fg)"},"今月")}
  svg.setAttribute("aria-label","今月の出費の累計 "+yen(A.length?A[A.length-1][1]:0)+"、先月の合計 "+yen(B.length?B[B.length-1][1]:0)+(limit?"、限度額 "+yen(limit):""));
  // hover
  const cross=el("line",{y1:m.t,y2:H-m.b,stroke:"var(--muted)","stroke-width":1,opacity:0});
  const dA=el("circle",{r:4,fill:"var(--accent)",stroke:"var(--surface)","stroke-width":2,opacity:0});
  const dB=el("circle",{r:4,fill:"var(--last)",stroke:"var(--surface)","stroke-width":2,opacity:0});
  const tip=$("tip");
  const move=ev=>{const r=svg.getBoundingClientRect();const px=(ev.clientX-r.left)*W/r.width;
    const d=Math.max(1,Math.min(N,Math.round((px-m.l)/(W-m.l-m.r)*(N-1)+1)));
    const a=A[d-1], b=B[d-1];cross.setAttribute("x1",x(d));cross.setAttribute("x2",x(d));cross.setAttribute("opacity",.6);
    if(a){dA.setAttribute("cx",x(d));dA.setAttribute("cy",y(a[1]));dA.setAttribute("opacity",1)}else dA.setAttribute("opacity",0);
    if(b){dB.setAttribute("cx",x(d));dB.setAttribute("cy",y(b[1]));dB.setAttribute("opacity",1)}else dB.setAttribute("opacity",0);
    tip.hidden=false;tip.textContent="";
    const l1=document.createElement("div");l1.textContent=d+"日までの合計";l1.style.opacity=.75;
    const l2=document.createElement("div");l2.textContent="今月 "+(a?yen(a[1]):"—");
    const l3=document.createElement("div");l3.textContent="先月 "+(b?yen(b[1]):"—");
    tip.append(l1,l2,l3);
    const left=x(d)/W*r.width;tip.style.left=Math.max(60,Math.min(r.width-60,left))+"px";tip.style.top="-6px";};
  svg.onpointermove=move;svg.onpointerdown=move;
  svg.onpointerleave=()=>{tip.hidden=true;cross.setAttribute("opacity",0);dA.setAttribute("opacity",0);dB.setAttribute("opacity",0)};
}

/* ---------- chart: weekly totals as paired bars ---------- */
function drawBars(v,dd,pd,upto){
  const svg=$("chart"), W=Math.max(280,$("chartwrap").clientWidth||520), H=210, m={l:46,r:10,t:22,b:24};
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const maxDay=Math.max(dd.length,pd.length)-1;
  const weeks=[[1,7],[8,14],[15,21],[22,28]];if(maxDay>28)weeks.push([29,maxDay]);
  const sum=(a,w,lim)=>{let s=0;for(let d=w[0];d<=Math.min(w[1],lim,a.length-1);d++)s+=a[d]||0;return s};
  const G=weeks.map(w=>({w,a:w[0]>upto?null:sum(dd,w,upto),b:w[0]>pd.length-1?null:sum(pd,w,99)}));
  const maxV=Math.max(1000,...G.map(g=>Math.max(g.a||0,g.b||0)))*1.12;
  const steps=[500,1000,2000,5000,10000,20000,50000];const step=steps.find(s=>maxV/s<=4)||100000;
  const top=Math.ceil(maxV/step)*step;
  const y=val=>m.t+(1-val/top)*(H-m.t-m.b), base=y(0);
  const gw=(W-m.l-m.r)/G.length, bw=Math.min(30,gw*.3);
  const NS="http://www.w3.org/2000/svg";svg.innerHTML="";
  const el=(t,at,txt)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e};
  for(let t=0;t<=top;t+=step){el("line",{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),stroke:"var(--line)","stroke-width":1});
    el("text",{x:m.l-6,y:y(t)+4,"text-anchor":"end","font-size":10.5,fill:"var(--muted)"},t?(t/10000>=1?(t/10000)+"万":(t/1000)+"千"):"0")}
  const bar=(x0,val,fill)=>{const h=base-y(val);if(h<=0)return;const r=Math.min(4,h,bw/2);
    el("path",{d:`M${x0} ${base}V${base-h+r}Q${x0} ${base-h} ${x0+r} ${base-h}H${x0+bw-r}Q${x0+bw} ${base-h} ${x0+bw} ${base-h+r}V${base}Z`,fill})};
  const tip=$("tip");
  G.forEach((g,i)=>{
    const cx=m.l+gw*(i+.5);
    if(g.b!=null)bar(cx-bw-1,g.b,"var(--last)");
    if(g.a!=null){bar(cx+1,g.a,"var(--accent)");
      if(g.a>0)el("text",{x:cx+1+bw/2,y:y(g.a)-6,"text-anchor":"middle","font-size":10.5,"font-weight":700,fill:"var(--fg)"},g.a>=10000?(g.a/10000).toFixed(1)+"万":g.a.toLocaleString("ja-JP"))}
    el("text",{x:cx,y:H-6,"text-anchor":"middle","font-size":10.5,fill:"var(--muted)"},g.w[0]+"〜"+g.w[1]+"日");
    const hit=el("rect",{x:cx-gw/2,y:m.t,width:gw,height:H-m.t-m.b,fill:"transparent"});
    const show=()=>{const r=svg.getBoundingClientRect();tip.hidden=false;tip.textContent="";
      const l1=document.createElement("div");l1.textContent=g.w[0]+"〜"+g.w[1]+"日";l1.style.opacity=.75;
      const l2=document.createElement("div");l2.textContent="今月 "+(g.a!=null?yen(g.a):"まだ");
      const l3=document.createElement("div");l3.textContent="先月 "+(g.b!=null?yen(g.b):"—");
      tip.append(l1,l2,l3);tip.style.left=Math.max(60,Math.min(r.width-60,cx/W*r.width))+"px";tip.style.top="-6px";hit.setAttribute("fill","var(--fg)");hit.setAttribute("opacity",.06)};
    hit.onpointerenter=show;hit.onpointerdown=show;
    hit.onpointerleave=()=>{tip.hidden=true;hit.setAttribute("fill","transparent");hit.setAttribute("opacity",1)};
  });
  svg.onpointermove=null;svg.onpointerdown=null;svg.onpointerleave=null;
  svg.setAttribute("aria-label","週ごとの出費。"+G.map(g=>g.w[0]+"〜"+g.w[1]+"日 今月"+(g.a!=null?yen(g.a):"なし")+" 先月"+(g.b!=null?yen(g.b):"なし")).join("、"));
}

/* ---------- day sheet ---------- */
function openSheet(d){S.sel=d;$("err").textContent="";$("amountIn").value="";$("scrim").hidden=false;$("sheet").hidden=false;fillSheet();setTimeout(()=>$("amountIn").focus(),50)}
function closeSheet(){S.sel=null;$("scrim").hidden=true;$("sheet").hidden=true}
function fillSheet(){
  const v=S.view,d=S.sel, list=items(v).filter(i=>i.day===d);
  $("sheetTitle").textContent=(v.m+1)+"月"+d+"日";
  $("sheetTotal").textContent="この日の合計 "+yen(list.reduce((s,i)=>s+i.amount,0));
  const ul=$("items");ul.innerHTML="";
  if(!list.length){const li=document.createElement("li");li.className="empty";li.textContent="まだ出費はありません";ul.append(li)}
  list.forEach(it=>{const li=document.createElement("li");
    const c=document.createElement("span");c.className="c";c.textContent=CAT[it.cat]||"その他";
    const val=document.createElement("span");val.className="v num";val.textContent=yen(it.amount);
    li.append(c,val);
    if(hasReal()){const del=document.createElement("button");del.className="del";del.textContent="削除";del.setAttribute("aria-label",yen(it.amount)+"を削除");
      del.onclick=()=>removeItem(key(v.y,v.m),it.id);li.append(del)}
    ul.append(li)});
  const cc=$("catChips");cc.innerHTML="";
  CATS.forEach(([k,l])=>{const c=document.createElement("button");c.className="chip";c.textContent=l;c.setAttribute("aria-pressed",S.cat===k);c.onclick=()=>{S.cat=k;fillSheet()};cc.append(c)});
}
function addItem(){
  const amt=parseInt(($("amountIn").value||"").replace(/[^\d]/g,""),10);
  if(!amt||amt<=0){$("err").textContent="金額を数字で入れてください（例：680）";return}
  if(amt>10000000){$("err").textContent="金額が大きすぎます";return}
  const v=S.view,k=key(v.y,v.m);
  $("err").textContent="";$("amountIn").value="";addExpense(k,S.sel,amt,S.cat);
}

/* ---------- events ---------- */
$("prevBtn").onclick=()=>{S.view=shift(S.view,-1);render()};
$("nextBtn").onclick=()=>{if(!isCur(S.view)){S.view=shift(S.view,1);render()}};
const setChart=t=>{S.chart=t;try{localStorage.setItem(LS+"-chart",t)}catch(e){}render()};
$("segLine").onclick=()=>setChart("line");$("segBar").onclick=()=>setChart("bar");
try{S.chart=localStorage.getItem(LS+"-chart")||"line"}catch(e){S.chart="line"}
$("limitToggle").onclick=()=>{S.panel=!S.panel;render()};
$("customSave").onclick=()=>{const n=parseInt(($("customIn").value||"").replace(/[^\d]/g,""),10);if(n>0){S.settings.custom=n;S.settings.mode="custom";saveSettings();$("customIn").blur();S.panel=false;render()}};
$("customIn").onkeydown=e=>{if(e.key==="Enter")$("customSave").click()};
$("fab").onclick=()=>openSheet(TODAY.d);
$("scrim").onclick=closeSheet;$("sheetClose").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sel)closeSheet()});
$("addBtn").onclick=addItem;$("amountIn").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing)addItem()};
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(render,120)});

$("signInBtn").onclick=()=>auth("in");$("signUpBtn").onclick=()=>auth("up");
$("authPw").onkeydown=e=>{if(e.key==="Enter")auth("in")};
$("logoutBtn").onclick=()=>sb.auth.signOut();
start();
})();
</script>
